# Builds the PlayStation Vita package only (eidos.vpk), with the free-move
# and trainer-cone patches (stubs/ov/patch_ov021_free_move.c,
# stubs/ov/patch_ov021_trainer_cone.c, sdk/free_move.c).
#
#   Runs on every push to main, or by hand: Actions > build > Run workflow.
#
#   The repository can hold either the source itself or just a zip of it
#   (eidos-freemove-full.zip, or any .zip with the eidos source inside)
#   at its top level: the first step unpacks it.
#   The .vpk is attached to the run as the artifact "eidos-vita".
#
# The game code comes from aletheia (Project-Holon/aletheia), checked out at
# the revision eidos is pinned to (cmake/aletheia_pin.cmake) unless a run
# by hand names another.  aletheia is public, so no token is needed; the
# ALETHEIA_TOKEN secret is used when it exists.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aletheia_ref:
        description: "aletheia revision or branch (blank: the pinned revision)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  vita:
    name: vita
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source zip (if the repository holds a zip)
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "source already unpacked"
            exit 0
          fi
          zip=$(ls *.zip 2>/dev/null | head -n 1)
          test -n "$zip" || { echo "::error::no source: upload the eidos zip to the repository's top level"; exit 1; }
          echo "unpacking $zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/src"
          # the source's top folder: the one holding cmake/aletheia_pin.cmake
          # (other folders have a CMakeLists.txt of their own)
          pinfile=$(find "$RUNNER_TEMP/src" -path '*/cmake/aletheia_pin.cmake' | head -n 1)
          test -n "$pinfile" || { echo "::error::no cmake/aletheia_pin.cmake inside $zip"; exit 1; }
          top=$(dirname "$(dirname "$pinfile")")
          echo "source folder: $top"
          cp -a "$top/." .
          ls

      - name: aletheia revision
        id: pin
        shell: bash
        run: |
          pin=$(sed -n 's/.*set(EIDOS_ALETHEIA_PIN "\([0-9a-f]*\)").*/\1/p' cmake/aletheia_pin.cmake)
          ref="${{ inputs.aletheia_ref }}"
          test -n "${ref:-$pin}"
          echo "revision=${ref:-$pin}" >> "$GITHUB_OUTPUT"
          echo "aletheia: ${ref:-$pin}"

      - uses: actions/checkout@v4
        with:
          repository: Project-Holon/aletheia
          ref: ${{ steps.pin.outputs.revision }}
          token: ${{ secrets.ALETHEIA_TOKEN || github.token }}
          path: aletheia

      - name: Stand-ins for the few ROM bytes the sources include (docs/release.md)
        run: python3 tools/package_release.py placeholders --aletheia-root aletheia

      - name: eidos.vpk (VitaSDK)
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" vitasdk/vitasdk:latest sh -c '
            set -e
            cmake -S . -B build-vita -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
              -DCMAKE_C_FLAGS="-O2 -fno-strict-aliasing -fwrapv -fno-delete-null-pointer-checks -fsigned-char" \
              -DEIDOS_BOOT=ON -DEIDOS_BOOT_ALL_GAME=ON -DEIDOS_OVERLAYS=ALL \
              -DEIDOS_TLS=OFF -DEIDOS_WASM=OFF -DEIDOS_DATA_TESTS=OFF -DEIDOS_REAL_OVERLAY_TESTS=OFF \
              -DALETHEIA_ROOT="$PWD/aletheia" \
              -DBW_DATA_ROOT="$PWD/no-game-data/extract/data" \
              -DSDL3_DIR=$VITASDK/arm-vita-eabi/lib/cmake/SDL3
            cmake --build build-vita --target eidos.vpk'

      # A patch whose function names aletheia no longer has is left out
      # quietly by the overlay linker; fail loudly instead.
      - name: The free-move patches are in the build
        shell: bash
        run: |
          units=$(find build-vita -name ovl_units.txt)
          test -n "$units" || { echo "no ovl_units.txt found"; exit 1; }
          for p in patch_ov021_free_move.c patch_ov021_trainer_cone.c; do
            if grep -q "$p" $units; then
              echo "linked: $p"
            else
              echo "::error::$p was not linked (aletheia renamed a function it patches?)"
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p dist
          cp build-vita/eidos.vpk dist/eidos-freemove-vita.vpk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eidos-vita
          path: dist/*.vpk
          if-no-files-found: error
